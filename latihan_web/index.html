<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NISAR Indonesia — latihan</title>

  <!-- Leaflet: pustaka peta. CSS dan JS-nya WAJIB dua-duanya. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg: #f7f7f5; --teks: #1d1d1b; --redup: #6b6b66;
      --berhasil: #1f7a4d; --negatif: #b4532a; --kartu: #ffffff; --garis: #e2e1dc;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161615; --teks: #ecebe6; --redup: #9b9a94; --kartu: #222220; --garis: #3a3a37; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--teks); }
    header { padding: 16px; }
    header h1 { margin: 0 0 4px; font-size: 1.3rem; }
    header p { margin: 0; color: var(--redup); }
    main { display: grid; grid-template-columns: 1fr 360px; gap: 12px; padding: 0 16px 16px; }
    #peta { height: 75vh; border-radius: 8px; }
    #panel { background: var(--kartu); border-radius: 8px; padding: 16px; overflow-y: auto; max-height: 75vh; }
    #panel h2 { margin: 8px 0; font-size: 1.15rem; }
    .redup { color: var(--redup); font-size: .9rem; }
    .label { display: inline-block; padding: 2px 8px; border-radius: 99px; color: #fff; font-size: .8rem; }
    .berhasil { background: var(--berhasil); }
    .negatif  { background: var(--negatif); }

    /* Legenda di pojok peta */
    .legenda { background: var(--kartu); color: var(--teks); padding: 8px 10px; border-radius: 6px;
               font-size: .85rem; line-height: 1.6; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
    .titik { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }

    /* Grafik batang sederhana (tanpa pustaka grafik) */
    .batang-baris { display: grid; grid-template-columns: 110px 1fr 52px; gap: 6px;
                    align-items: center; font-size: .85rem; margin: 4px 0; }
    .batang-lajur { background: var(--garis); height: 12px; border-radius: 3px; }
    .batang-isi { height: 12px; border-radius: 3px; }

    /* Gambar di panel */
    .gambar { margin: 14px 0 0; }
    .gambar img { width: 100%; border-radius: 6px; display: block; cursor: zoom-in; }
    .gambar figcaption { font-size: .82rem; color: var(--redup); margin-top: 4px; }
    .jenis { font-size: .7rem; padding: 1px 6px; border-radius: 4px; margin-right: 4px;
             text-transform: uppercase; letter-spacing: .03em; }
    .jenis.radar { background: #2c5f8a; color: #fff; }   /* bukti */
    .jenis.foto  { background: var(--garis); color: var(--teks); }   /* pelengkap */

    /* Layar HP: peta di atas, panel di bawah. */
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } #peta { height: 55vh; } }
  </style>
</head>
<body>
  <header>
    <h1>Apa yang dilihat radar NISAR di Indonesia</h1>
    <p>Tiga berhasil, tiga negatif terukur. Klik titik di peta.</p>
  </header>

  <main>
    <div id="peta"></div>
    <aside id="panel">
      <p>Pilih satu lokasi di peta.</p>
      <p class="redup">Hijau = sinyal terdeteksi dengan kontrol. Oranye = negatif terukur:
        sinyalnya tidak lebih besar dari derau, dan itu juga hasil.</p>
    </aside>
  </main>

  <script>
    // ==================================================================
    // 1. DATA — satu-satunya sumber kebenaran halaman ini.
    //    Dipanggang di sini, BUKAN diambil dari NISAR saat demo.
    //    Koordinat: Krakatau dari krakatau_koherensi.py; Kalbar/SME2/Flores
    //    = pusat bingkai dari cari_koordinat.py; Jakarta & Cirata dari
    //    kotak pencarian di cek_auth.py dan potong_bendungan.py.
    // ==================================================================
    const TEMUAN = [
      {
        nama: "Letusan Anak Krakatau",
        lat: -6.102, lon: 105.423,
        status: "berhasil",
        metode: "Koherensi GUNW, jalur 010A, kontrol 3 pulau tetangga di bingkai yang sama",
        angka: "Koherensi 0,7678 → 0,2391 saat letusan (−8,7 σ). Pulau tetangga hanya −1,1 s/d −1,5 σ.",
        // Data tambahan khusus temuan ini -> panel menggambar grafik.
        grafik: {
          judul: "Simpangan dari kondisi normal (σ) saat letusan",
          batang: [
            { label: "Anak Krakatau", nilai: -8.7 },
            { label: "Sertung",       nilai: -1.5 },
            { label: "Rakata",        nilai: -1.2 },
            { label: "Panjang",       nilai: -1.1 },
          ],
        },
        // Gambar: jenis "radar" = BUKTI (analisis sendiri); "foto" = yang
        // dilihat mata (NASA Worldview), pelengkap, bukan bukti.
        gambar: [
          { src: "gambar/radar_krakatau_deret.jpg", jenis: "radar",
            judul: "Koherensi radar per 12 hari. Panel bertanda merah = letusan: " +
                   "pulau berubah biru gelap (runtuh), pulau tetangga tetap." },
          { src: "gambar/krakatau_2026-09-05_viirs_n20.jpg", jenis: "foto",
            judul: "5 Sep 2026: awan letusan dari Anak Krakatau memanjang ke barat. " +
                   "VIIRS NOAA-20, NASA Worldview." },
          { src: "gambar/krakatau_2026-09-04_viirs_n20.jpg", jenis: "foto",
            judul: "4 Sep 2026: gumpalan tipis ke barat daya. VIIRS NOAA-20, NASA Worldview." },
        ],
      },
      {
        nama: "Karhutla Kalimantan Barat",
        lat: 0.529, lon: 109.006,
        status: "berhasil",
        metode: "Hamburan balik GCOV HV, rasio dB 24 Jun → 16 Sep, divalidasi titik panas FIRMS",
        angka: "Penurunan ≥3 dB 9,2× lebih sering di titik panas (4,4%) dibanding seluruh bingkai (0,5%).",
        catatan: "Titik = kelompok terpadat dari 179 titik panas FIRMS yang JUGA turun >3 dB di radar " +
                 "(30 titik dalam ~11 km). Dari nisar/cari_titik_karhutla.py.",
        gambar: [
          { src: "gambar/radar_kalbar_hv.jpg", jenis: "radar",
            judul: "Perubahan hamburan balik HV 24 Jun → 16 Sep. Merah = tajuk hilang (bekas bakar)." },
          { src: "gambar/kalbar_2026-08-31_viirs_n20.jpg", jenis: "foto",
            judul: "31 Agu 2026: gumpalan asap keluar dari titik api (merah) ke timur laut. " +
                   "VIIRS NOAA-20, NASA Worldview." },
          { src: "gambar/kalbar_2026-08-30_modis_aqua.jpg", jenis: "foto",
            judul: "30 Agu 2026: daratan tertutup kabut asap; titik api berkumpul di lokasi temuan. " +
                   "MODIS Aqua, NASA Worldview. Titik merah = deteksi api VIIRS sepanjang hari itu, " +
                   "bukan pada detik foto diambil." },
        ],
      },
      {
        nama: "Kekeringan El Niño (Kalimantan Tengah)",
        lat: -1.095, lon: 111.987,
        status: "berhasil",
        metode: "Kelembapan tanah SME2, 41 tanggal Jun–Sep 2026",
        angka: "Kelembapan tanah Kalteng 0,360 → 0,237 (Kalbar 0,367 → 0,272).",
        catatan: "Titik = pusat bingkai SME2 (sisi barat Kalimantan Tengah).",
      },
      {
        nama: "Amblesan Jakarta",
        lat: -6.20, lon: 106.80,
        status: "negatif",
        metode: "Rantai 6 interferogram + koreksi ionosfer",
        angka: "Sinyal 2–6 cm lawan derau 2,92 cm: 84 hari terlalu pendek untuk amblesan.",
      },
      {
        nama: "Bendungan Cirata",
        lat: -6.70, lon: 107.37,
        status: "negatif",
        metode: "GUNW dua geometri (jalur menurun + menaik)",
        angka: "+3,54 sb di satu geometri, TIDAK terkonfirmasi di geometri kedua. Positif palsu yang tertangkap.",
      },
      {
        nama: "Gempa Flores M7,7",
        lat: -9.065, lon: 120.695,
        status: "negatif",
        metode: "Fasa dan koherensi GUNW, kontrol pra/ko/pasca-seismik",
        angka: "Koherensi rasio 0,96–0,98×: kerusakan 9 ha = 56 piksel dari 7,6 juta.",
        catatan: "Titik = pusat bingkai radar (di Selat Sumba), BUKAN pusat gempa. " +
                 "Pusat gempanya memang di laut; ganti dengan koordinat resmi BMKG.",
      },
    ];

    const WARNA = { berhasil: "#1f7a4d", negatif: "#b4532a" };

    // ==================================================================
    // 2. PETA
    // ==================================================================
    const peta = L.map("peta").setView([-2.5, 115], 5);   // tengah Indonesia
    // Ubin peta dari Esri. Riwayat (3 Okt 2026), supaya tidak diulang:
    //   tile.openstreetmap.org -> 403 "Access blocked" (tanpa Referer, bahkan
    //                             dengan Referer localhost)
    //   CARTO basemaps         -> gambar bertanda air "API KEY REQUIRED"
    //   Esri (di bawah)        -> isi ubin DILIHAT langsung, normal
    // Perhatikan urutan {z}/{y}/{x} di Esri: y dulu, berbeda dengan OSM.
    const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services";
    const jalan = L.tileLayer(`${ESRI}/World_Street_Map/MapServer/tile/{z}/{y}/{x}`, {
      attribution: "Ubin &copy; Esri",
      maxZoom: 12,
    });
    const citra = L.tileLayer(`${ESRI}/World_Imagery/MapServer/tile/{z}/{y}/{x}`, {
      attribution: "Citra &copy; Esri, Maxar, Earthstar Geographics",
      maxZoom: 12,
    });
    jalan.addTo(peta);                                     // lapisan awal
    L.control.layers({ "Peta jalan": jalan, "Citra satelit": citra }).addTo(peta);

    // ==================================================================
    // 3. PENANDA — satu lingkaran per temuan
    // ==================================================================
    for (const t of TEMUAN) {
      L.circleMarker([t.lat, t.lon], {
        radius: 9,
        color: WARNA[t.status],      // garis tepi
        fillColor: WARNA[t.status],  // isi
        fillOpacity: 0.8,
        weight: 2,
      })
        .addTo(peta)
        .bindTooltip(t.nama)          // muncul saat kursor di atasnya
        .on("click", () => tampilkan(t));
    }

    // ==================================================================
    // 4. LEGENDA — kotak kecil di pojok kanan bawah peta
    // ==================================================================
    const legenda = L.control({ position: "bottomright" });
    legenda.onAdd = () => {
      const div = L.DomUtil.create("div", "legenda");
      div.innerHTML =
        `<span class="titik" style="background:${WARNA.berhasil}"></span>berhasil<br>` +
        `<span class="titik" style="background:${WARNA.negatif}"></span>negatif terukur`;
      return div;
    };
    legenda.addTo(peta);

    // ==================================================================
    // 5. PANEL — diisi saat penanda diklik
    // ==================================================================
    function tampilkan(t) {
      const panel = document.getElementById("panel");
      panel.innerHTML = `
        <span class="label ${t.status}">${t.status}</span>
        <h2>${t.nama}</h2>
        <p class="redup">${t.metode}</p>
        <p><strong>${t.angka}</strong></p>
        ${t.catatan ? `<p class="redup">${t.catatan}</p>` : ""}
        ${t.grafik ? gambarGrafik(t.grafik) : ""}
        ${t.gambar ? t.gambar.map(tampilkanGambar).join("") : ""}
      `;
      peta.flyTo([t.lat, t.lon], 8);
    }

    // Satu gambar + keterangan. Klik gambar = buka ukuran penuh di tab baru.
    function tampilkanGambar(g) {
      return `
        <figure class="gambar">
          <a href="${g.src}" target="_blank" rel="noopener">
            <img src="${g.src}" alt="${g.judul}" loading="lazy">
          </a>
          <figcaption><span class="jenis ${g.jenis}">${g.jenis}</span> ${g.judul}</figcaption>
        </figure>`;
    }

    // Grafik batang dari div biasa. Panjang batang = |nilai| / nilai terbesar.
    function gambarGrafik(g) {
      const maks = Math.max(...g.batang.map(b => Math.abs(b.nilai)));
      const baris = g.batang.map((b, i) => `
        <div class="batang-baris">
          <span>${b.label}</span>
          <div class="batang-lajur">
            <div class="batang-isi" style="width:${(Math.abs(b.nilai) / maks) * 100}%;
                 background:${i === 0 ? WARNA.berhasil : "#9b9a94"}"></div>
          </div>
          <span>${b.nilai.toFixed(1)} σ</span>
        </div>`).join("");
      return `<p class="redup">${g.judul}</p>${baris}`;
    }
  </script>
</body>
</html>
